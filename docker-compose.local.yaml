networks:
  newtique-network:
    driver: bridge

volumes:
  postgres-data:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: newtique
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - newtique-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtique"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../NewTique_Ecommerce-Backend
    environment:
      DB_NAME: newtique
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: "False"
      SECRET_KEY: "your-secret-key-here"
    ports:
      - "8000:8000"
    networks:
      - newtique-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  frontend:
    build:
      context: ../NewTique_Ecommerce-Frontend
    ports:
      - "3000:3000"
    networks:
      - newtique-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend
    networks:
      - newtique-network