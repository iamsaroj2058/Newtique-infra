version: "3.8"

networks:
  newtique-network:
    driver: bridge

volumes:
  postgres-data:

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: newtique
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - newtique-network

  backend:
    build:
      context: ../NewTique_Ecommerce-Backend
    restart: always
    environment:
      DB_NAME: newtique
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: "False"
      SECRET_KEY: "your-secret-key-here"
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - newtique-network

  frontend:
    build:
      context: ../NewTique_Ecommerce-Frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - newtique-network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - newtique-network
